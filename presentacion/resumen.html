<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presupuesto 2027 · Resumen para concejales</title>
<style>
@page{size:A4;margin:9mm 10mm}
:root{--marino:#213654;--turquesa:#0a93b6;--azul:#3f6db3;--agua:#24997f;--verde:#449d41;--lima:#7e9f23;--ambar:#c98a14;--rojo:#b5453a;--gris:#5d6c74;--linea:#d5dee2;--tinta:#1b252b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:Arial,Helvetica,sans-serif;font-size:10.4pt;line-height:1.3;color:var(--tinta);background:#fff;max-width:190mm;width:100%;margin:0 auto;padding:0 2px;overflow-x:hidden}
img{max-width:100%}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--turquesa);padding-bottom:5px;margin-bottom:7px}
header img{height:38px}
header .t{text-align:right}
header h1{font-size:17pt;color:var(--marino);line-height:1.05}
header p{font-size:8.6pt;color:var(--gris)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:7px}
.kpi{border:1px solid var(--linea);border-top:4px solid var(--turquesa);border-radius:5px;padding:4px 7px}
.kpi b{display:block;font-size:16pt;color:var(--marino);line-height:1.1}
.kpi span{font-size:8.2pt;color:var(--gris);line-height:1.15;display:block}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:9px}
h2{font-size:11.6pt;color:var(--marino);border-bottom:1px solid var(--linea);padding-bottom:2px;margin:10px 0 5px}
h2:first-child{margin-top:0}
.bar{display:flex;height:17px;border-radius:4px;overflow:hidden;margin:3px 0}
.bar i{display:flex;align-items:center;justify-content:center;color:#fff;font:700 8.5pt Arial;font-style:normal}
.fila{display:grid;grid-template-columns:44mm 1fr 27mm;gap:5px;align-items:center;margin:2.4px 0;font-size:9.3pt}
.fila .p{height:9px;background:#e8eef1;border-radius:3px;overflow:hidden}.fila .p i{display:block;height:100%}
.fila .v{text-align:right;font-weight:700;color:var(--marino);white-space:nowrap}.fila .v small{font-weight:400;color:var(--gris)}
ul{padding-left:12px}li{margin:2px 0;font-size:9.6pt}
.caja{border:1px solid var(--linea);border-radius:5px;padding:5px 8px;margin-top:6px;background:#f7fafb}
.caja.al{background:#fff7e6;border-color:#efd9a2}
.caja h3{font-size:10.2pt;color:var(--marino);margin-bottom:2px}
.pie{margin-top:9px;border-top:1px solid var(--linea);padding-top:5px;font-size:7.8pt;color:var(--gris);line-height:1.3}
b.t{color:var(--marino)}
.qrres{display:flex;gap:10px;align-items:center;margin-top:7px;font-size:8.6pt;color:var(--gris)}.qrres svg{width:22mm;height:22mm;flex:none}.qrres b{color:var(--marino);display:block;font-size:10pt}
@media screen and (max-width:760px){body{font-size:11pt}.cols{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}header{flex-direction:column;align-items:flex-start;gap:6px}header .t{text-align:left}.fila{grid-template-columns:36% 1fr 32%}.fila .v{white-space:normal}}
</style>
</head>
